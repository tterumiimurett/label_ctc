<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clarification / Backchannel 一致性标注</title><style>
:root{--ink:#1f2937;--muted:#64748b;--line:#dbe2ea;--blue:#1f77b4;--orange:#ff7f0e;--red:#dc2626;--accent:#0f766e}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px/1.45 Arial,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:18px}h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}.muted{color:var(--muted);font-size:12px}.card{border:1px solid var(--line);border-radius:8px;padding:16px;margin:14px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}button{background:white;border:1px solid #94a3b8;border-radius:5px;padding:7px 13px;cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.5}.wavewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:#fafcff;margin-top:10px}canvas{display:block;cursor:crosshair;touch-action:none}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0}.legend b{display:inline-block;width:12px;height:12px;margin-right:5px;border-radius:2px}.transcripts{display:grid;grid-template-columns:1fr 1fr;gap:12px}textarea{width:100%;font:inherit;border:1px solid #cbd5e1;border-radius:5px;padding:9px;resize:vertical}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.choices label{border:1px solid #cbd5e1;border-radius:6px;padding:8px 12px;cursor:pointer;background:#f8fafc;font-weight:bold}.choices label:has(input:checked){background:#eff6ff;border-color:var(--accent);color:var(--accent)}.prompt{padding:10px;background:#f8fafc;border-radius:6px;margin:12px 0}audio{width:100%;margin-top:8px}input[type=number]{width:85px;padding:5px;border:1px solid #cbd5e1;border-radius:4px}@media(max-width:700px){.transcripts{grid-template-columns:1fr}}
</style></head><body><main>
<header class="row"><div><h1>Clarification / Backchannel 一致性标注</h1><div class="muted">模型身份与 Judge 结果隐藏的盲标批次；每条标签按标注者独立保存</div></div><strong id="progress">加载中…</strong></header>
<section class="card"><div class="row"><div><h2 id="caseTitle">正在读取样本</h2><span id="caseMeta" class="muted"></span></div><span id="caseStatus" class="muted"></span></div><div id="definition" class="prompt"><button id="closeDefinition" type="button" style="float:right">关闭</button><strong id="definitionTitle"></strong><p id="definitionText"></p></div><p id="instruction" class="prompt"></p></section>
<section class="card"><h2>双声道播放与定位</h2><div class="row"><div><button id="play" type="button">播放 / 暂停</button> <button id="replay" type="button">从标记前 2 秒播放</button></div><label>缩放 <input id="zoom" type="range" min="1" max="3" step="0.1" value="1"></label><span id="clock" class="muted">0.00 s</span></div><audio id="audio" controls preload="metadata"></audio><div class="legend"><span><b style="background:var(--blue)"></b>用户 · 左声道</span><span><b style="background:var(--orange)"></b>模型 · 右声道</span><span><b style="background:var(--red)"></b>判断起点</span></div><div class="wavewrap"><canvas id="wave" width="1120" height="220"></canvas></div><p><label>判断起点 <input id="filler" type="number" min="0" step="0.01"> s</label> <span class="muted">点击波形定位；拖动红线修正时间。</span></p><div class="transcripts"><label>用户问题 transcript<textarea id="userText" rows="3"></textarea></label><label>模型首回复 transcript<textarea id="modelText" rows="3"></textarea></label></div></section>
<section class="card"><h2>你的判断</h2><div class="prompt"><strong id="behaviorQuestion"></strong><div id="behaviorChoices" class="choices"></div></div><div class="prompt"><strong>2. 模型 transcript 与实际听到的语音是否有明显区别？</strong><div class="choices"><label><input type="radio" name="asr" value="match"> 没有明显区别</label><label><input type="radio" name="asr" value="material"> 有明显区别</label><label><input type="radio" name="asr" value="uncertain"> 无法判断</label></div></div><label>3. 问题或备注<textarea id="note" rows="3" placeholder="可写实际听到的内容和判断理由。"></textarea></label><div class="row" style="margin-top:14px"><div><button id="prev" type="button">上一条</button> <button id="next" type="button">保存并下一条</button></div><button id="save" class="primary" type="button">保存</button></div><p id="saveStatus" class="muted">每条标签单独保存。</p></section>
</main><script>
const params=new URLSearchParams(location.search),annotator=params.get('annotator')||'',api=path=>`${path}?annotator=${encodeURIComponent(annotator)}`;
const q=id=>document.getElementById(id),audio=q('audio'),canvas=q('wave'),ctx=canvas.getContext('2d');let batch=[],index=0,channels=null,duration=1,dragMode=null,dirty=false,pendingSeek=null;
const checked=name=>document.querySelector(`input[name="${name}"]:checked`)?.value||null;
function current(){return batch[index]}
function draw(){const w=1120*(+q('zoom').value),h=220;canvas.width=w;canvas.height=h;ctx.fillStyle='#fafcff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#dbe2ea';ctx.beginPath();ctx.moveTo(0,110);ctx.lineTo(w,110);ctx.stroke();for(let c=0;c<2;c++){const data=channels?.[c],mid=c?165:55;ctx.fillStyle=c?'#ff7f0e':'#1f77b4';for(let x=0;x<w;x+=2){let amp=0;if(data){const a=Math.floor(x/w*data.length),b=Math.min(data.length,Math.floor((x+2)/w*data.length)+1),step=Math.max(1,Math.floor((b-a)/16));for(let i=a;i<b;i+=step)amp=Math.max(amp,Math.abs(data[i]))}const bar=Math.max(1,amp*38);ctx.fillRect(x,mid-bar,1.4,bar*2)}}const red=(+q('filler').value/duration)*w,play=(audio.currentTime/duration)*w;ctx.fillStyle='#dc2626';ctx.fillRect(red-2,0,4,h);ctx.fillText('anchor',Math.min(red+7,w-70),17);ctx.fillStyle='#0f766e';ctx.fillRect(play,0,2,h);ctx.fillStyle='#64748b';for(let t=0;t<=duration;t+=Math.max(2,Math.ceil(duration/10))){ctx.fillText(`${t}s`,t/duration*w+3,h-5)}}
function label(){return {key:current().key,task_type:current().task_type,behavior_label:checked('behavior'),asr_quality:checked('asr'),user_transcript:q('userText').value,model_transcript:q('modelText').value,note:q('note').value}}
async function save(){if(!checked('behavior')||!checked('asr')){q('saveStatus').textContent='请完成行为判断和 transcript 判断。';return false}try{const r=await fetch(api(`/api/label/${current().key}`),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(label())}),v=await r.json();if(!r.ok||!v.saved)throw Error(v.error||'save_failed');dirty=false;q('saveStatus').textContent='已保存到服务器';q('caseStatus').textContent='已保存';return true}catch(e){q('saveStatus').textContent=`保存失败：${e.message}`;return false}}
async function show(i){index=i;const c=current(),clar=c.task_type==='clarification';audio.pause();audio.src=api(c.audio);audio.load();channels=null;duration=1;q('progress').textContent=`${i+1} / ${batch.length}`;q('caseTitle').textContent=`样本 ${i+1}`;q('caseMeta').textContent=clar?'Clarification':'Backchannel';q('definition').style.display='block';q('definitionTitle').textContent=clar?'Clarification 定义':'Backchannel 定义';q('definitionText').textContent=clar?'当说话者没有完全理解，或不确定前一位说话者说了什么、表达了什么意思时，所提出的请求。':'D1. 直接回应另一方话语的内容；D2. 是可选的；D3. 不要求另一方作出确认或回应。三个条件全部满足才是附和。';q('instruction').textContent=clar?'请听完整用户问题和模型回复。':'请结合 Judge 使用的同一段用户 context，判断红线处的模型片段。';q('behaviorQuestion').textContent=clar?'1. 模型回复属于哪种行为？':'1. 模型片段是不是 Backchannel（附和）？';q('behaviorChoices').innerHTML=clar?'<label><input type="radio" name="behavior" value="clarification"> 做澄清</label><label><input type="radio" name="behavior" value="answer"> 回答问题</label><label><input type="radio" name="behavior" value="other"> 其他行为</label>':'<label><input type="radio" name="behavior" value="yes"> 是</label><label><input type="radio" name="behavior" value="no"> 否</label><label><input type="radio" name="behavior" value="uncertain"> 无法判断</label>';q('filler').value=c.anchor_s;q('userText').value=c.user_transcript;q('modelText').value=c.model_transcript;q('note').value='';document.querySelectorAll('input[type=radio]').forEach(el=>el.checked=false);q('caseStatus').textContent='未标注';q('saveStatus').textContent='每条标签单独保存。';q('prev').disabled=i===0;q('next').disabled=i===batch.length-1;draw();try{const r=await fetch(api(`/api/label/${c.key}`));if(r.ok){const d=await r.json();if(index!==i)return;q('filler').value=d.filler_end_s??c.anchor_s;q('userText').value=d.user_transcript??c.user_transcript;q('modelText').value=d.model_transcript??c.model_transcript;q('note').value=d.note??'';for(const [name,value] of [['behavior',d.behavior_label],['asr',d.asr_quality]])if(value)document.querySelector(`input[name="${name}"][value="${value}"]`).checked=true;q('caseStatus').textContent='已保存';q('saveStatus').textContent='已恢复这条标签。';draw()}}catch{}fetch(api(c.audio)).then(r=>r.arrayBuffer()).then(b=>new(window.AudioContext||window.webkitAudioContext)().decodeAudioData(b)).then(buffer=>{if(index!==i)return;duration=buffer.duration;channels=[buffer.getChannelData(0),buffer.getChannelData(1)];draw()}).catch(()=>{q('saveStatus').textContent+=' 波形载入失败；仍可用音频播放器。'});dirty=false}
q('closeDefinition').onclick=()=>q('definition').style.display='none';q('save').onclick=save;q('next').onclick=async()=>{if(await save())show(index+1)};q('prev').onclick=()=>{if(dirty&&!confirm('当前修改未保存，仍要返回上一条吗？'))return;show(index-1)};q('play').onclick=()=>audio.paused?audio.play():audio.pause();q('replay').onclick=()=>{audio.currentTime=Math.max(0,+q('filler').value-2);audio.play()};q('zoom').oninput=draw;audio.ontimeupdate=()=>{q('clock').textContent=`${audio.currentTime.toFixed(2)} / ${duration.toFixed(2)} s`;draw()};document.querySelectorAll('input,textarea').forEach(el=>{el.addEventListener('input',()=>dirty=true);el.addEventListener('change',()=>dirty=true)});
function waveTime(e){const rect=canvas.getBoundingClientRect();return Math.max(0,Math.min(duration,(e.clientX-rect.left)/rect.width*duration))}
function seekWave(e){const time=waveTime(e);if(audio.readyState>=1)audio.currentTime=time;else pendingSeek=time;q('clock').textContent=`${time.toFixed(2)} / ${duration.toFixed(2)} s`;draw()}
audio.addEventListener('loadedmetadata',()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)duration=audio.duration;if(pendingSeek!==null){audio.currentTime=pendingSeek;pendingSeek=null}draw()});
canvas.onpointerdown=e=>{const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*canvas.width,red=+q('filler').value/duration*canvas.width;dragMode=Math.abs(x-red)<16?'filler':'seek';canvas.setPointerCapture(e.pointerId);if(dragMode==='seek')seekWave(e);draw()};
canvas.onpointermove=e=>{if(!dragMode)return;if(dragMode==='filler'){q('filler').value=waveTime(e).toFixed(2);dirty=true;draw()}else seekWave(e)};
canvas.onpointerup=()=>dragMode=null;canvas.onpointercancel=()=>dragMode=null;
Promise.all([fetch(api('/api/tasks')).then(r=>r.json()),fetch(api('/api/progress')).then(r=>r.json())]).then(([d,p])=>{batch=d.cases;if(!batch.length)throw Error('批次为空');const saved=new Set(p.saved_keys||[]);const first=batch.findIndex(c=>!saved.has(c.key));const requested=Number(new URLSearchParams(location.search).get('case'));const target=Number.isInteger(requested)&&requested>=1&&requested<=batch.length?requested-1:(first<0?batch.length-1:first);show(target);q('saveStatus').textContent=`已恢复你的进度：${p.saved_count}/${p.total} 条已保存。`}).catch(e=>{q('progress').textContent='加载失败';q('saveStatus').textContent=e.message});
</script></body></html>
